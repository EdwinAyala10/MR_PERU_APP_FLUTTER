flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/loaders/
    - assets/images/
    - assets/icon/
    - google_fonts/montserrat_alternates/

dependency_overrides:
  win32: 5.5.4
  intl: 0.19.0
