  flutter_riverpod: 2.6.1
  flutter_spinkit: 5.2.2
  flutter_staggered_grid_view: 0.7.0
  flutter_svg: 2.2.2
  font_awesome_flutter: 10.9.1
  formz: 0.6.1
  geolocator: 11.1.0
  get_it: 7.7.0
