name: crm_app
description: "Una app CRM"
publish_to: "none"

version: 2.4.9+37

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  animate_do: 3.3.9
  cupertino_icons: 1.0.8
  dio: 5.9.0
  equatable: 2.0.8
