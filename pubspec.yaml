dev_dependencies:
  change_app_package_name: 1.5.0
  flutter_launcher_icons: 0.13.1
  flutter_lints: 2.0.3
  flutter_test:
    sdk: flutter
  launcher_name: 1.0.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon_ios.jpg"
  min_sdk_android: 23

flutter_native_splash:
  color: "#ffffff"

launcher_name:
  default: "Force MR"
